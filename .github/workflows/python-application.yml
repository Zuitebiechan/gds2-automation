name: Python application

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Stable Python regressions
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cloud.txt
          pip install pytest

      - name: Run stable regression suite
        run: >
          python -m pytest
          tests/test_server_layout.py
          tests/test_backend_capability_architecture.py
          tests/test_backend_capability_refactor.py
          tests/test_runtime_session_layers.py
          tests/test_runtime_diagnostics_navigation.py
          tests/test_tunnel_quality.py
          tests/test_proxy_benchmark.py
          tests/test_repo_layout_consistency.py
          -q

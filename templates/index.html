<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GDS2 Data Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            color: #2c3e50;
            font-size: 14px;
            -webkit-tap-highlight-color: transparent;
        }

        .top-bar {
            background: #fff;
            border-bottom: 1px solid #ddd;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        @media (min-width: 768px) {
            .top-bar {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                padding: 12px 24px;
            }
        }

        .top-bar h1 { font-size: 16px; font-weight: 600; }

        .state-row {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            flex-wrap: wrap;
        }

        .state-row .label { color: #888; }

        .state-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .state-main_menu { background: #d4edda; color: #155724; }
        .state-module_list { background: #e2e3e5; color: #383d41; }
        .state-module_submenu { background: #d1ecf1; color: #0c5460; }
        .state-data_list { background: #fff3cd; color: #856404; }
        .state-sub_data_list { background: #ffeeba; color: #856404; }
        .state-data_display { background: #cce5ff; color: #004085; }
        .state-device_explorer { background: #e2d5f3; color: #5a3d8a; }
        .state-vehicle_selection { background: #f5c6cb; color: #721c24; }
        .state-diagnostics_menu { background: #bee5eb; color: #0c5460; }
        .state-unknown { background: #f8d7da; color: #721c24; }

        .info-item { display: flex; align-items: center; gap: 4px; }
        .info-item .val { font-weight: 600; color: #2c3e50; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .container { max-width: 1200px; margin: 0 auto; padding: 12px; }
        @media (min-width: 768px) { .container { padding: 20px 24px; } }

        .alert { display: none; padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; }
        .alert.show { display: block; }
        .alert-loading { background: #fff3cd; border: 1px solid #ffc107; color: #856404; }
        .alert-error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .alert-success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }

        .panel { background: #fff; border-radius: 8px; border: 1px solid #e1e8ed; padding: 16px; margin-bottom: 12px; }
        .panel h3 { font-size: 14px; margin-bottom: 4px; }
        .panel .hint { font-size: 12px; color: #888; margin-bottom: 12px; }

        button {
            padding: 10px 18px; border: none; border-radius: 6px; font-size: 14px; font-weight: 600;
            cursor: pointer; transition: background 0.15s, transform 0.1s; touch-action: manipulation;
        }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        .btn-primary { background: #3498db; color: #fff; }
        .btn-primary:hover:not(:disabled) { background: #2980b9; }
        .btn-success { background: #27ae60; color: #fff; }
        .btn-success:hover:not(:disabled) { background: #229954; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-danger:hover:not(:disabled) { background: #c0392b; }
        .btn-small { padding: 6px 12px; font-size: 12px; }

        select { padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background: #fff; width: 100%; }
        select:disabled { background: #f5f5f5; cursor: not-allowed; }

        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; min-width: 400px; }
        th { padding: 10px 12px; text-align: left; font-size: 11px; font-weight: 600; color: #666; text-transform: uppercase; background: #f8f9fa; border-bottom: 1px solid #e1e8ed; position: sticky; top: 0; }
        td { padding: 8px 12px; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
        tr:hover { background: #fafbfc; }
        .table-scroll { max-height: 400px; overflow-y: auto; }

        .changes-log { max-height: 200px; overflow-y: auto; background: #f8f9fa; border: 1px solid #e1e8ed; border-radius: 6px; margin-bottom: 12px; font-size: 12px; }
        .change-item { padding: 6px 12px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .change-item:last-child { border-bottom: none; }
        .change-time { color: #999; min-width: 50px; font-size: 11px; }
        .change-param { font-weight: 600; color: #2c3e50; }
        .change-old { color: #e74c3c; text-decoration: line-through; }
        .change-arrow { color: #999; }
        .change-new { color: #27ae60; font-weight: 600; }

        .agent-badge { display: inline-block; padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .agent-badge.available { background: #d4edda; color: #155724; }
        .agent-badge.unavailable { background: #f8d7da; color: #721c24; }
        .agent-badge.streaming { background: #cce5ff; color: #004085; }

        .dtc-count-badge { background: #e74c3c; color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 700; }
        .dtc-count-badge.zero { background: #27ae60; }

        .results-panel { background: #fff; border-radius: 8px; border: 1px solid #e1e8ed; overflow: hidden; }
        .results-header { padding: 12px 16px; border-bottom: 1px solid #e1e8ed; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
        .results-header h3 { font-size: 14px; }

        .start-section { text-align: center; padding: 20px; }
        .start-section .hint { margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>GDS2 Data Viewer</h1>
        <div class="state-row">
            <div class="info-item">
                <span class="label">Page:</span>
                <span id="gds2-state" class="state-badge state-unknown">UNKNOWN</span>
            </div>
            <div class="info-item">
                <span class="label">Device:</span>
                <span id="current-device" class="val">-</span>
            </div>
            <div class="info-item">
                <span class="label">Module:</span>
                <span id="current-module" class="val">-</span>
            </div>
            <div class="info-item">
                <span class="label">Data:</span>
                <span id="current-data" class="val">-</span>
            </div>
        </div>
    </div>

    <div class="container">
        <div id="v-loading" class="alert alert-loading"></div>
        <div id="v-error" class="alert alert-error"></div>
        <div id="v-success" class="alert alert-success"></div>

        <div class="panel">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
                <h3 style="margin:0;">Connection</h3>
                <span id="v-agent-badge" class="agent-badge unavailable">CHECKING</span>
            </div>

            <!-- Step 1: Start button (shown initially) -->
            <div id="v-start-section" class="start-section">
                <div class="hint">Click Start to scan for available VCI devices. GDS2 must be at Main Menu.</div>
                <button id="v-start-btn" class="btn-success" onclick="viewerStart()">Start</button>
            </div>

            <!-- Step 2: Device selection (shown after Start, stays visible) -->
            <div id="v-device-section" style="display:none;">
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px;">
                    <div>
                        <label style="font-size:12px;color:#888;display:block;margin-bottom:4px;">Device</label>
                        <div style="display:flex;gap:6px;">
                            <select id="v-device" style="flex:1;" onchange="viewerDeviceChanged()">
                                <option value="">-- Select Device --</option>
                            </select>
                            <button id="v-change-device-btn" class="btn-small btn-primary" onclick="viewerChangeDevice()" title="Change Device">⟳</button>
                        </div>
                    </div>
                    <div>
                        <label style="font-size:12px;color:#888;display:block;margin-bottom:4px;">Module</label>
                        <select id="v-module" style="width:100%;" disabled onchange="viewerSelectModule()">
                            <option value="">-- Select Module --</option>
                        </select>
                    </div>
                    <div>
                        <label style="font-size:12px;color:#888;display:block;margin-bottom:4px;">Data Category</label>
                        <select id="v-data" style="width:100%;" disabled onchange="viewerSelectData()">
                            <option value="">-- Select Data --</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="v-status-bar" style="background:#f8f9fa;border:1px solid #e1e8ed;border-radius:6px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;">
                <span id="v-status-text" style="font-weight:600;font-size:13px;">Click Start to begin</span>
                <button id="v-stop-btn" class="btn-danger btn-small" style="display:none;" onclick="viewerStop()">Stop</button>
            </div>
        </div>

        <div id="v-dtc-panel" class="panel" style="display:none;">
            <h3>DTCs <span id="v-dtc-count" class="dtc-count-badge zero">0</span></h3>
            <div class="table-container"><div id="v-dtc-data" class="table-scroll"></div></div>
        </div>

        <div id="v-params-panel" class="results-panel" style="display:none;">
            <div class="results-header">
                <h3>Live Parameters</h3>
                <span style="font-size:12px;color:#888;">Changes: <strong id="v-change-count">0</strong></span>
            </div>
            <div class="table-container"><div id="v-params-data" class="table-scroll"></div></div>
        </div>

        <div id="v-changes-panel" class="panel" style="display:none;">
            <h3 style="margin-bottom:8px;">Parameter Changes</h3>
            <div id="v-changes-log" class="changes-log">
                <div class="change-item" style="background:#f0f0f0;font-weight:600;"><span class="change-time">Time</span><span class="change-param">Parameter</span><span>Old → New</span></div>
            </div>
        </div>
    </div>

    <script>
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function escapeAttr(str) {
        return String(str).replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function updateStateDisplay(page, context) {
        const b = document.getElementById('gds2-state');
        b.className = 'state-badge state-' + (page || 'unknown');
        b.textContent = (page || 'unknown').replace(/_/g, ' ').toUpperCase();
        document.getElementById('current-device').textContent = context?.device || '-';
        document.getElementById('current-module').textContent = context?.module || '-';
        document.getElementById('current-data').textContent = context?.data_category || '-';
    }

    // ===== Data Viewer =====
    const viewer = {
        device: null, module: null, dataCategory: null,
        devices: [], modules: [], dataCategories: [],
        monitoring: false,
        eventSource: null, totalChanges: 0,
        deviceConnected: false,
    };

    async function viewerCheckAgent() {
        try {
            const d = await (await fetch('/api/agent/status')).json();
            const b = document.getElementById('v-agent-badge');
            if (d.agent && d.agent.available) {
                b.className = 'agent-badge available'; b.textContent = 'AGENT OK';
            } else {
                b.className = 'agent-badge unavailable'; b.textContent = 'NO AGENT';
            }
        } catch(e) {
            document.getElementById('v-agent-badge').className = 'agent-badge unavailable';
            document.getElementById('v-agent-badge').textContent = 'ERROR';
        }
    }

    function viewerSetStatus(text, type) {
        const el = document.getElementById('v-status-text');
        el.textContent = text;
        el.style.color = type === 'error' ? '#e74c3c' : type === 'monitoring' ? '#27ae60' : '#2c3e50';
    }

    function showViewerLoading(msg) {
        const e = document.getElementById('v-loading'); e.textContent = msg; e.classList.add('show');
        document.getElementById('v-error').classList.remove('show');
    }
    function hideViewerLoading() { document.getElementById('v-loading').classList.remove('show'); }
    function showViewerError(msg) { const e = document.getElementById('v-error'); e.textContent = msg; e.classList.add('show'); hideViewerLoading(); }
    function showViewerSuccess(msg) { const e = document.getElementById('v-success'); e.textContent = msg; e.classList.add('show'); hideViewerLoading(); setTimeout(()=>e.classList.remove('show'), 3000); }

    async function viewerStart() {
        showViewerLoading('Scanning for devices...');
        viewerSetStatus('Navigating...', 'loading');
        document.getElementById('v-start-btn').disabled = true;

        try {
            const d = await (await fetch('/api/viewer/start', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({})
            })).json();

            if (d.success) {
                if (d.modules) {
                    // Device already connected - start() navigated all the way to Module List
                    viewer.deviceConnected = true;
                    viewer.device = d.device || 'Connected Device';
                    viewer.modules = d.modules;
                    viewer.module = null;
                    viewer.dataCategory = null;

                    // Update device dropdown with connected device
                    const deviceSel = document.getElementById('v-device');
                    deviceSel.innerHTML = `<option value="${escapeAttr(viewer.device)}" selected>${viewer.device}</option>`;

                    // Update module dropdown
                    const moduleSel = document.getElementById('v-module');
                    moduleSel.innerHTML = '<option value="">-- Select Module (' + viewer.modules.length + ') --</option>' +
                        viewer.modules.map(m => `<option value="${escapeAttr(m)}">${m}</option>`).join('');
                    moduleSel.disabled = false;

                    document.getElementById('v-data').innerHTML = '<option value="">-- Select Data --</option>';
                    document.getElementById('v-data').disabled = true;

                    document.getElementById('v-start-section').style.display = 'none';
                    document.getElementById('v-device-section').style.display = 'block';

                    viewerSetStatus('Connected. Select a module.', '');
                    showViewerSuccess('Device connected. ' + viewer.modules.length + ' modules found.');
                    if (d.vin) viewerSetStatus('VIN: ' + d.vin + '. Select a module.', '');

                    updateStateDisplay('module_list', { device: viewer.device, module: null, data_category: null });

                } else if (d.devices && d.devices.length > 0) {
                    // Device not connected - show device selection
                    viewer.devices = d.devices;
                    const sel = document.getElementById('v-device');
                    sel.innerHTML = '<option value="">-- Select Device (' + d.devices.length + ') --</option>' +
                        d.devices.map(dev => `<option value="${escapeAttr(dev)}">${dev}</option>`).join('');

                    document.getElementById('v-start-section').style.display = 'none';
                    document.getElementById('v-device-section').style.display = 'block';

                    viewerSetStatus('Select a device to connect', '');
                    showViewerSuccess('Found ' + d.devices.length + ' device(s)');
                    updateStateDisplay('device_explorer', {});
                } else {
                    showViewerError('No devices found');
                    viewerSetStatus('No devices found', 'error');
                }
            } else {
                showViewerError(d.error || 'Start failed');
                viewerSetStatus('Start failed', 'error');
            }
        } catch(e) {
            showViewerError(e.message);
            viewerSetStatus('Start failed', 'error');
        }
        document.getElementById('v-start-btn').disabled = false;
    }

    function viewerDeviceChanged() {
        const device = document.getElementById('v-device').value;
        if (!device) return;

        // User selected a new device - connect to it
        viewerConnectDevice(device);
    }

    async function viewerChangeDevice() {
        showViewerLoading('Navigating to Device Explorer...');
        viewerSetStatus('Opening Device Explorer...', 'loading');
        document.getElementById('v-change-device-btn').disabled = true;
        document.getElementById('v-device').disabled = true;
        document.getElementById('v-module').disabled = true;
        document.getElementById('v-data').disabled = true;
        viewerStopSSE();

        try {
            const d = await (await fetch('/api/viewer/change_device', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({})
            })).json();

            if (d.success && d.devices && d.devices.length > 0) {
                viewer.devices = d.devices;
                viewer.deviceConnected = false;  // Reset so user must select

                // Update device dropdown with all available devices
                const sel = document.getElementById('v-device');
                sel.innerHTML = '<option value="">-- Select Device (' + d.devices.length + ') --</option>' +
                    d.devices.map(dev => `<option value="${escapeAttr(dev)}">${dev}</option>`).join('');
                sel.disabled = false;

                // Clear module and data selections
                document.getElementById('v-module').innerHTML = '<option value="">-- Select Module --</option>';
                document.getElementById('v-module').disabled = true;
                document.getElementById('v-data').innerHTML = '<option value="">-- Select Data --</option>';
                document.getElementById('v-data').disabled = true;

                viewerSetStatus('Select a device to connect', '');
                showViewerSuccess('Found ' + d.devices.length + ' device(s). Select one to connect.');
                updateStateDisplay('device_explorer', { device: null, module: null, data_category: null });
            } else {
                showViewerError(d.error || 'No devices found');
                viewerSetStatus('Failed to get devices', 'error');
                document.getElementById('v-device').disabled = false;
            }
        } catch(e) {
            showViewerError(e.message);
            viewerSetStatus('Failed to get devices', 'error');
            document.getElementById('v-device').disabled = false;
        }
        document.getElementById('v-change-device-btn').disabled = false;
    }

    async function viewerConnectDevice(device) {
        // If device_connected is true, we don't need a device selection
        if (!viewer.deviceConnected && !device) {
            return;
        }

        viewerStopSSE();
        viewer.monitoring = false;
        document.getElementById('v-stop-btn').style.display = 'none';

        // Disable all dropdowns during connection
        document.getElementById('v-device').disabled = true;
        document.getElementById('v-module').disabled = true;
        document.getElementById('v-data').disabled = true;

        showViewerLoading('Connecting to ' + (device || 'device') + '...');
        viewerSetStatus('Connecting to device...', 'loading');

        try {
            const d = await (await fetch('/api/viewer/connect', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ device: device || 'default' })
            })).json();

            if (d.success) {
                // Use device name from response, fallback to request device
                viewer.device = d.device || device || 'Connected';
                viewer.modules = d.modules || [];
                viewer.module = null;
                viewer.dataCategory = null;

                // Update device dropdown to show current device
                const deviceSel = document.getElementById('v-device');
                if (viewer.device && viewer.device !== 'Connected') {
                    // Make sure the device is in the dropdown and selected
                    let found = false;
                    for (let opt of deviceSel.options) {
                        if (opt.value === viewer.device) {
                            opt.selected = true;
                            found = true;
                        } else {
                            opt.selected = false;
                        }
                    }
                    // If not found, add it
                    if (!found && viewer.device) {
                        deviceSel.innerHTML = `<option value="${escapeAttr(viewer.device)}" selected>${viewer.device}</option>`;
                    }
                }

                const sel = document.getElementById('v-module');
                sel.innerHTML = '<option value="">-- Select Module (' + viewer.modules.length + ') --</option>' +
                    viewer.modules.map(m => `<option value="${escapeAttr(m)}">${m}</option>`).join('');
                sel.disabled = false;

                document.getElementById('v-data').innerHTML = '<option value="">-- Select Data --</option>';
                document.getElementById('v-data').disabled = true;

                // Re-enable device dropdown so user can switch devices
                document.getElementById('v-device').disabled = false;

                viewerSetStatus('Connected. Select a module.', '');
                showViewerSuccess('Connected. ' + viewer.modules.length + ' modules found.');
                if (d.vin) viewerSetStatus('VIN: ' + d.vin + '. Select a module.', '');

                updateStateDisplay('module_list', { device: viewer.device, module: null, data_category: null });
            } else {
                showViewerError(d.error || 'Connection failed');
                viewerSetStatus('Connection failed', 'error');
                // Re-enable device dropdown on error
                document.getElementById('v-device').disabled = false;
            }
        } catch(e) {
            showViewerError(e.message);
            viewerSetStatus('Connection failed', 'error');
            // Re-enable device dropdown on error
            document.getElementById('v-device').disabled = false;
        }
    }

    // Keep old function name for backward compatibility
    async function viewerConnect() {
        const device = document.getElementById('v-device')?.value || '';
        viewerConnectDevice(device);
    }

    async function viewerSelectModule() {
        const module = document.getElementById('v-module').value;
        if (!module) return;

        showViewerLoading('Selecting ' + module + '...');
        viewerSetStatus('Scanning data categories...', 'loading');
        document.getElementById('v-data').disabled = true;
        viewerStopSSE();

        try {
            const d = await (await fetch('/api/viewer/select_module', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ module })
            })).json();

            if (d.success) {
                viewer.module = module;
                viewer.dataCategories = d.data_categories || [];
                viewer.dataCategory = null;

                const sel = document.getElementById('v-data');
                sel.innerHTML = '<option value="">-- Select Data (' + viewer.dataCategories.length + ') --</option>' +
                    viewer.dataCategories.map(c => `<option value="${escapeAttr(c)}">${c}</option>`).join('');
                sel.disabled = false;

                viewerSetStatus('Ready. Select a data category.', '');
                showViewerSuccess(viewer.dataCategories.length + ' data categories found.');

                updateStateDisplay('data_list', { device: viewer.device, module, data_category: null });
            } else {
                showViewerError(d.error || 'Failed');
                viewerSetStatus('Module selection failed', 'error');
            }
        } catch(e) {
            showViewerError(e.message);
            viewerSetStatus('Module selection failed', 'error');
        }
    }

    async function viewerSelectData() {
        const dataCategory = document.getElementById('v-data').value;
        if (!dataCategory) return;

        showViewerLoading('Selecting ' + dataCategory + '...');
        viewerSetStatus('Navigating to Data Display...', 'loading');
        viewerStopSSE();

        try {
            const d = await (await fetch('/api/viewer/select_data', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ data_category: dataCategory })
            })).json();

            if (d.success) {
                viewer.dataCategory = dataCategory;
                viewer.monitoring = true;
                viewer.totalChanges = 0;

                document.getElementById('v-change-count').textContent = '0';
                viewerSetStatus('Monitoring ' + dataCategory, 'monitoring');
                showViewerSuccess('Monitoring started');
                document.getElementById('v-stop-btn').style.display = '';
                document.getElementById('v-params-panel').style.display = 'block';
                document.getElementById('v-changes-panel').style.display = 'block';

                updateStateDisplay('data_display', { device: viewer.device, module: viewer.module, data_category: dataCategory });

                // Start SSE for agent streaming
                await fetch('/api/agent/monitor/start', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ interval_ms: 100 })
                });
                viewerStartSSE();
            } else {
                showViewerError(d.error || 'Failed');
                viewerSetStatus('Data selection failed', 'error');
            }
        } catch(e) {
            showViewerError(e.message);
            viewerSetStatus('Data selection failed', 'error');
        }
    }

    function viewerStartSSE() {
        viewerStopSSE();
        viewer.eventSource = new EventSource('/api/stream/events');

        viewer.eventSource.addEventListener('snapshot', e => {
            const d = JSON.parse(e.data);

            if (d.parameters) {
                document.getElementById('v-params-data').innerHTML =
                    '<table><thead><tr><th>Module</th><th>Parameter</th><th>Value</th><th>Unit</th></tr></thead><tbody>' +
                    d.parameters.map(p => '<tr><td>'+escapeHtml(p.module)+'</td><td>'+escapeHtml(p.name)+'</td><td><strong>'+escapeHtml(p.value)+'</strong></td><td>'+escapeHtml(p.unit)+'</td></tr>').join('') +
                    '</tbody></table>';
            }

            if (d.dtcs) {
                const panel = document.getElementById('v-dtc-panel');
                const badge = document.getElementById('v-dtc-count');
                badge.textContent = d.dtcs.length;
                badge.className = d.dtcs.length > 0 ? 'dtc-count-badge' : 'dtc-count-badge zero';
                if (d.dtcs.length > 0) {
                    document.getElementById('v-dtc-data').innerHTML =
                        '<table><thead><tr><th>Code</th><th>Module</th><th>Description</th><th>Status</th></tr></thead><tbody>' +
                        d.dtcs.map(dt => '<tr><td><strong>'+escapeHtml(dt.code)+'</strong></td><td>'+escapeHtml(dt.control_module||dt.module)+'</td><td>'+escapeHtml(dt.description)+'</td><td>'+escapeHtml(dt.status)+'</td></tr>').join('') +
                        '</tbody></table>';
                    panel.style.display = 'block';
                } else { panel.style.display = 'none'; }
            }

            if (d.param_changes && d.param_changes.length > 0) {
                viewer.totalChanges += d.param_changes.length;
                document.getElementById('v-change-count').textContent = viewer.totalChanges;
                const log = document.getElementById('v-changes-log');
                d.param_changes.forEach(c => {
                    const i = document.createElement('div');
                    i.className = 'change-item';
                    i.innerHTML = '<span class="change-time">' + escapeHtml(new Date(c.timestamp).toLocaleTimeString()) + '</span>' +
                        '<span class="change-param">' + escapeHtml(c.parameter) + '</span>' +
                        '<span class="change-old">' + escapeHtml(c.old_value) + '</span>' +
                        '<span class="change-arrow">\u2192</span>' +
                        '<span class="change-new">' + escapeHtml(c.new_value) + '</span>';
                    log.insertBefore(i, log.children[1] || null);
                    while (log.children.length > 101) log.removeChild(log.lastChild);
                });
            }
        });

        viewer.eventSource.onerror = () => {
            if (viewer.monitoring) setTimeout(() => { if (viewer.monitoring) viewerStartSSE(); }, 2000);
        };
    }

    function viewerStopSSE() {
        if (viewer.eventSource) { viewer.eventSource.close(); viewer.eventSource = null; }
    }

    async function viewerStop() {
        viewerStopSSE();
        viewer.monitoring = false;
        document.getElementById('v-stop-btn').style.display = 'none';
        viewerSetStatus('Stopped', '');

        try {
            await fetch('/api/viewer/stop', { method: 'POST' });
            await fetch('/api/stream/stop', { method: 'POST' });
        } catch(e) {}
    }

    viewerCheckAgent();
    </script>
</body>
</html>
